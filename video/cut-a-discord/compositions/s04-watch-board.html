          var q = function (sel) {

          var tl = gsap.timeline({ paused: true });
          function build() {
            var cam = $("s04-cam");
            SQ.camSet(tl, cam, SQ.frame(1, 960, 540));
            SQ.land(tl, $("s04-chip"), 0.3);

            // 0.00 the board lands under the maroon wipe reveal; columns build left -> right 0.08 s apart, busy blocks fade in per column
            SQ.land(tl, $("s04-board"), 0.0, { from: { scale: 0.85 } });
            tl.fromTo(q(".wb-day"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.6);
            for (var i = 0; i < 5; i++) {
              tl.fromTo($("s04-col" + i), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0.6 + i * 0.08);
              tl.fromTo(q(".s04-busy" + i), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.9 + i * 0.08);
            }
            tl.fromTo($("s04-feed"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.2);
            // "watching" dot: a finite pulse every 0.9 s
            tl.fromTo($("s04-dot"), { scale: 1, opacity: 1 }, { scale: 1.35, opacity: 0.5, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 35 }, 0.6);

            // "nobody has to ask" 1.98: super slams, holds to 3.6
            SQ.fitSuper($("s04-super"));
            SQ.slam(tl, $("s04-super"), 1.98);
            SQ.exit(tl, $("s04-super"), 3.6, 0.2);

            // "background" 3.75: one gold scan line sweeps the calendars
            gsap.set($("s04-scan"), { opacity: 0 });
            tl.set($("s04-scan"), { opacity: 0 }, 0);
            tl.set($("s04-scan"), { opacity: 1 }, 3.75);
            tl.fromTo($("s04-scan"), { x: 0 }, { x: 1012, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 3.75);
            tl.set($("s04-scan"), { opacity: 0 }, 4.95);

            // "Sun Devil Central" 6.74 (regenerated s04.wav): ring the feed, cards stream down the rail 0.3 s apart
            SQ.ring(tl, $("hl-s04-1"), 6.74);
            SQ.ringOut(tl, $("hl-s04-1"), 8.4);
            ["paint", "board", "mic", "hike", "more"].forEach(function (k, n) {
              tl.fromTo($("s04-ev-" + k), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.8 + n * 0.3);
            });
            q(".wb-st").forEach(function (el) {
              gsap.set(el, { opacity: 0 });
              tl.set(el, { opacity: 0 }, 0);
            });
            q(".wb-probe, .wb-check").forEach(function (el) {
              gsap.set(el, { opacity: 0 });
              tl.set(el, { opacity: 0 }, 0);
            });
            gsap.set($("s04-band"), { scaleX: 0 });
            tl.set($("s04-band"), { scaleX: 0 }, 0);

            // "everyone's calendars" 8.72: push into the columns
            tl.to(cam, Object.assign(SQ.frame(1.08, 900, 500), { duration: 0.7, ease: "power2.inOut" }), 8.72);

            // try a candidate: the rail card steps left, its slot shows in all five columns, then the verdict
            function tryEv(k, at, misses, verdictAt, back) {
              var card = $("s04-ev-" + k);
              tl.to(card, { x: -18, duration: 0.2, ease: "power2.out" }, at);
              q(".s04-p-" + k).forEach(function (p, i) {
                tl.fromTo(p, { opacity: 0, scaleX: 0 }, { opacity: 0.9, scaleX: 1, duration: 0.2, ease: "power2.out" }, at + 0.08 + i * 0.04);
              });
              misses.forEach(function (i) {
                tl.to($("s04-p-" + k + i), { backgroundColor: "#8e8e93", duration: 0.12 }, verdictAt);
              });
              SQ.land(tl, $("s04-st-" + k), verdictAt + 0.05, { from: { rotation: 3 }, to: { rotation: 3 } });
              if (back) {
                tl.to(card, { keyframes: [{ x: -26, duration: 0.06 }, { x: -10, duration: 0.06 }, { x: -24, duration: 0.06 }, { x: -18, duration: 0.06 }] }, verdictAt + 0.2);
                tl.to(card, { x: 0, opacity: 0.55, duration: 0.25, ease: "power2.inOut" }, back);
                tl.to(q(".s04-p-" + k), { opacity: 0, duration: 0.2 }, back);
              }
            }
            // "what they like" 9.48: Paint Your 3D Print, calendars clear, but not Jordan / Leo / Ash's thing
            tryEv("paint", 9.4, [1, 3, 4], 9.8, 10.9);
            // "clash" 12.34: Board Game Night hits Leo's Thu 6-9 PM block, which flashes red twice
            tryEv("board", 12.0, [], 12.34, 13.0);
            tl.to($("s04-p-board3"), { backgroundColor: "#e5484d", duration: 0.05 }, 12.34);
            [12.34, 12.64].forEach(function (t) {
              tl.to($("s04-leo-thu"), { backgroundColor: "#e5484d", color: "#fff", duration: 0.04 }, t);
              tl.to($("s04-leo-thu"), { backgroundColor: "#c9c2b4", color: "#3a3a3a", duration: 0.04 }, t + 0.15);
            });
            // "somebody… but" 13.10: Desert Sunset Hike, only Leo's thing
            tryEv("hike", 13.05, [0, 1, 2, 4], 13.3, 14.0);

            // "fits" 15.06: Open Mic Night lands on Fri 7-9 PM, the gold band sweeps all five columns
            tryEv("mic", 14.75, [], 15.06, null);
            tl.to($("s04-band"), { scaleX: 1, duration: 0.45, ease: "power3.out" }, 15.06);
            tl.to(q(".s04-p-mic"), { backgroundColor: "#ffc627", duration: 0.2 }, 15.06);
            // "the whole squad" 15.55: a check per friend, Maya -> Ash
            for (var c = 0; c < 5; c++) {
              SQ.land(tl, $("s04-ok" + c), 15.55 + c * 0.08);
            }

            // "posts" 16.49: the Open Mic card lifts off, the board blurs out, the card ends centred for the chat
            var mic = $("s04-ev-mic");
            var m0 = SQ.offset(mic, cam);
            tl.to(mic, { x: 960 - 170 - m0.x, y: 540 - 43 - m0.y, scale: 1.4, duration: 0.6, ease: "power3.inOut" }, 16.49);
            tl.to(cam, Object.assign(SQ.frame(1, 960, 540), { duration: 0.6, ease: "power3.inOut" }), 16.49);
            tl.to(q("#s04-board > :not(#s04-ev-mic)"), { opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, 16.49);
            tl.to($("s04-board"), { backgroundColor: "rgba(255,253,247,0)", borderColor: "rgba(17,17,17,0)", boxShadow: "8px 8px 0 rgba(17,17,17,0)", duration: 0.5, ease: "power2.in" }, 16.49);
            window.__timelines["s04"] = tl;
          }
          if (document.fonts && document.fonts.status !== "loaded") {
            document.fonts.ready.then(build);

            build();
