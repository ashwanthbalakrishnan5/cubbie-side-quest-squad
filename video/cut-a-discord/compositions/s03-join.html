            // "You join" 2.91: ring on the /squad join autocomplete row

            tl.to(pop, { opacity: 0, duration: 0.08, ease: "none" }, 3.4);

            var ml = $("s03-ml1");

            tl.to(list, { y: y1, duration: 0.2, ease: "power3.out" }, 12.35);

            [15.3, 15.5, 15.7, 15.9].forEach(function (t, i) {
              SQ.land(tl, $("s03-fr" + i), t);
            });
            // "when you're busy" 16.56: the locked calendar chips pulse once
            root.querySelectorAll(".s03-fr .sq-lock.wrap").forEach(function (el, i) {
