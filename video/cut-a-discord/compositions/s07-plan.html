            tl.to(cam, Object.assign(SQ.frame(1.5, c2.x, c2.y, 980, 560), { duration: 0.5, ease: "power3.inOut" }), 3.85);
            SQ.ring(tl, $("s07-ring1"), 4.36);
            SQ.ringOut(tl, $("s07-ring1"), 6.6);

            var posts = [0, 1, 2, 3, 4].map(function (i) {

            var ty0 = DC.bottomY(ts, posts[0]);

            tl.to(th, { x: 420, duration: 0.2, ease: "power3.in" }, 8.7);

            // "there's a poll" 8.95: the poll posts below the card; camera onto the who line + poll

            tl.set(m6, { opacity: 1 }, 8.95);
            DC.arrive(tl, $("s07-poll"), 8.95);
            var pc = DC.at(win, $("s07-poll"), 0.5, 0.5, y6);
            var wc = DC.at(win, $("s07-who"), 0.5, 0, y6);
            var pb = DC.at(win, $("s07-poll"), 0.5, 1, y6);
            tl.to(cam, Object.assign(SQ.frame(1.4, pc.x, (wc.y + pb.y) / 2, 960, 560), { duration: 0.6, ease: "power3.inOut" }), 8.75);

            // "Votes start rolling in" 9.54: Maya 9.54, Ash 10.34 (his cursor), Priya 11.14, Jordan 11.94
            var w = [0, 1, 2, 3, 4].map(function (i) {

            hideAt0(w.slice(1));
            var n0 = $("s07-n0").children,

            hideAt0([].slice.call(n0).concat([].slice.call(n2), [].slice.call(foot, 1), [$("s07-n1")]));

            var V = [9.54, 10.34, 11.14, 11.94];

            tl.to([n0[0], n2[0], $("s07-n1")], { opacity: 1, duration: 0.13 }, V[0] + 0.13);
            DC.swap(tl, n0[0], n0[1], V[1]);
            DC.swap(tl, n0[1], n0[2], V[2]);
            DC.swap(tl, n0[2], n0[3], V[3]);
            DC.swap(tl, n2[0], n2[1], V[3]);
            tl.to($("s07-f0"), { scaleX: 1, duration: 0.4, ease: "power2.out" }, V[0]);

            gsap.set(cur, { x: off.x, y: off.y, opacity: 0 });

            DC.press(tl, cur, V[1]);
            var away = { x: yesRow.x + 300, y: yesRow.y + 260 };
            DC.move(tl, cur, 10.5, yesRow, away, 0.4);
            tl.to(cur, { opacity: 0, duration: 0.15 }, 10.8);

            tl.to(cam, Object.assign(SQ.frame(1.43, pc.x, (wc.y + pb.y) / 2, 960, 560), { duration: 1.4, ease: "sine.inOut" }), 12.4);

            var grow = $("s07-grow");

            tl.fromTo(grow, { backgroundColor: "#45487a" }, { backgroundColor: "#fff4e0", duration: 0.4, ease: "power1.in", immediateRender: false }, 15.12);
