            // "their own agent" (3.19): agent cards land (stagger 0.12 s); each event card shrinks into its icon in card j, row j

              SQ.land(tl, slot, CB + j * 0.12);
              var ico = $("s05-r" + j + j).querySelector(".ag-ico");
              var p = SQ.offset(ico, world);
              var ev = $("s05-ev" + j);
              var e0 = SQ.offset(ev, world);
              tl.fromTo(
                ev,
                { x: 0, y: 0, scale: 1 },
                { x: p.x - e0.x, y: p.y - e0.y, scale: 34 / 300, duration: 0.5, ease: "power2.inOut", immediateRender: false },
                CB + j * 0.12,
              );
              tl.fromTo(ev, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.25, ease: "sine.in", yoyo: true, repeat: 1, immediateRender: false }, CB + j * 0.12);

                  return Math.round(x) + "/10";
                });

              }), t, 0.06, 0.13);

            // "Maya's" 4.01
            tl.to(cam, Object.assign(SQ.frame(1.3, 560, 500), { duration: 0.6, ease: "power3.inOut" }), 3.85);
            say(0, 4.01);
            SQ.ring(tl, $("hl-s05-maya"), 4.3);
            SQ.ringOut(tl, $("hl-s05-maya"), 6.1);
            // "Jordan's" 6.34
            tl.to(cam, Object.assign(SQ.frame(1.3, 900, 500), { duration: 0.6, ease: "power3.inOut" }), 6.2);
            say(1, 6.34);
            SQ.ring(tl, $("hl-s05-say1"), 6.34);
            say(2, 7.0);
            SQ.ringOut(tl, $("hl-s05-say1"), 7.9);
            // "Leo ... hiking" 8.09
            tl.to(cam, Object.assign(SQ.frame(1.3, 1560, 500), { duration: 0.6, ease: "power3.inOut" }), 7.95);
            say(3, 8.09);
            SQ.ring(tl, $("hl-s05-leo"), 8.09);
            SQ.ringOut(tl, $("hl-s05-leo"), 10.0);

            // 10.3 pull back; the row shrinks to 0.85 about (960, 330) and drops 60 px, clearing the super zone
            tl.to(cam, Object.assign(SQ.frame(1, 960, 540), { duration: 0.7, ease: "power2.inOut" }), 10.3);
            gsap.set($("s05-row"), { transformOrigin: "960px 330px" });
            tl.fromTo($("s05-row"), { scale: 1, y: 0 }, { scale: 0.85, y: 60, duration: 0.7, ease: "power2.inOut" }, 11.2);
            // "what's safe" 12.55: the four shared lines ringed, the locked chips dim; the super says it
            [0, 1, 2, 3].forEach(function (q) {
              SQ.ring(tl, $("hl-s05-say" + q), 12.55 + q * 0.06);
              SQ.ringOut(tl, $("hl-s05-say" + q), 13.7);
              tl.to($("s05-chips" + q), { opacity: 0.45, duration: 0.3, ease: "power1.out" }, 12.55);
              tl.to($("s05-chips" + q), { opacity: 1, duration: 0.2, ease: "power1.out" }, 13.7);
            });
            SQ.fitSuper($("s05-super"));
            SQ.slam(tl, $("s05-super"), 12.7);
            SQ.exit(tl, $("s05-super"), 15.1, 0.2);

            // "the coordinator" 14.03: lands above the row; the speeches step aside
            [0, 1, 2, 3].forEach(function (q) {
              SQ.exit(tl, $("s05-say" + q), 13.85, 0.2);
            });
            var co = $("s05-co");
            SQ.land(tl, co, 14.03);

            // Priya close-up: rings, push in, the $5
            SQ.ring(tl, $("s05-ring-row"), 15.3);
            SQ.ring(tl, $("s05-ring-chips"), 15.3);
            tl.to(cam, Object.assign(SQ.frame(1.3, 1010, 420), { duration: 0.6, ease: "power3.inOut" }), 15.2);
            SQ.land(tl, $("s05-price"), 15.5, { from: { rotation: 6 }, to: { rotation: 6 } });
            // "a budget limit" 16.20: the lock opens, the public half flies to the Coordinator on a 12 % arc
            var priv = $("s05-chip20");
            SQ.lockOpen(tl, priv.querySelector(".sq-lockglyph"), 16.2);
            var pub = $("s05-public");
            var pc = SQ.offset(priv, world);
            // the row is scaled 0.85 about (960, 330) and dropped 60 px by now
            pc = { x: 960 + (pc.x - 960) * 0.85, y: 330 + (pc.y - 330) * 0.85 + 60 };
            gsap.set(pub, { x: pc.x, y: pc.y, opacity: 0 });
            tl.set(pub, { x: pc.x, y: pc.y }, 0);
            tl.fromTo(pub, { opacity: 0 }, { opacity: 1, duration: 0.08 }, 16.2);
            tl.fromTo(pub, { y: pc.y }, { y: pc.y - 24, duration: 0.3, ease: "power2.out" }, 16.2);
            var inbox = SQ.offset(root.querySelector(".co-inbox"), world);
            var dst = { x: inbox.x + 18, y: inbox.y + 14 };
            SQ.arc(tl, pub, 16.55, 0.7, { x: pc.x, y: pc.y - 24 }, dst, undefined, "power2.inOut");
            SQ.ringOut(tl, $("s05-ring-row"), 17.2);
            // "Not who" 17.45: the private half blurs
            tl.fromTo(priv, { opacity: 1, filter: "blur(0px)" }, { opacity: 0.55, filter: "blur(6px)", duration: 0.5, ease: "power1.out" }, 17.45);
            SQ.ringOut(tl, $("s05-ring-chips"), 18.3);

            // pull back, then Priya's card becomes the world (hand-off to S06: plain cream last frame)
            tl.to(cam, Object.assign(SQ.frame(1, 960, 540), { duration: 0.45, ease: "power2.inOut" }), 18.45);
            [0, 1, 3].forEach(function (k, i) {
              tl.to($("s05-ag" + k), { y: 900, duration: 0.3, ease: "power3.in" }, 18.6 + i * 0.04);
            });
            var pr = $("s05-ag2");
            var card = $("s05-card2");
            var g = SQ.offset(card, world);
            var ccx = g.x + 190, ccy = g.y + 235;
            gsap.set(pr, { transformOrigin: ccx - pr.offsetLeft + "px " + (ccy - pr.offsetTop) + "px" });
            tl.to(pr, { scale: 12, duration: 0.65, ease: "power2.inOut" }, 19.0);
            tl.to(card, { borderRadius: 0, backgroundColor: "#fff4e0", duration: 0.65, ease: "power2.inOut" }, 19.0);
            tl.to(card.children, { opacity: 0, duration: 0.3, ease: "power1.in" }, 19.0);
            tl.to([co, pub], { opacity: 0, filter: "blur(15px)", duration: 0.3, ease: "power1.in" }, 19.0);
            window.__timelines["s05"] = tl;
          }
          if (document.fonts && document.fonts.status !== "loaded") {
            document.fonts.ready.then(build);
          } else {
            build();
          }
        })();
      </script>
