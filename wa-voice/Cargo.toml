[package]
name = "wa-voice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
axum = { version = "0.8", features = ["ws"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", features = ["voip"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", features = [
    "sqlite-storage",
    "tokio-transport",
    "ureq-client",
    "tokio-native",
    "voip-relay-native",
    "voip-mlow",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
